name: Apply DUO operational hardening once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-hardening-once.yml"

permissions:
  contents: write

jobs:
  apply-hardening:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Apply operational purchase hardening
        run: node scripts/applyOperationalServiceHardening.js

      - name: Apply legacy subscription hardening
        run: node scripts/applyLegacySubscriptionHardening.js

      - name: Validate syntax
        run: |
          node --check src/routes/orders.js
          node --check src/routes/pricing.js
          node --check src/services/subscriptions/subscriptionExtraSessions.js
          node --check src/services/subscriptions/subscriptionPlanPurchase.js
          node --check src/services/subscriptions/subscriptionLifecycle.js
          node --check src/services/subscriptions/subscriptionBootstrap.js

      - name: Run hardening tests
        run: |
          node scripts/testOperationalPurchaseHardening.js
          node scripts/testLegacySubscriptionHardening.js
          node scripts/testSubscriptionBootstrapHardening.js

      - name: Remove local backup artifacts
        run: |
          find src -type f \( -name "*.bak-operational-*" -o -name "*.bak-legacy-subscription-*" \) -delete

      - name: Commit hardened sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/routes/orders.js \
            src/routes/pricing.js \
            src/services/subscriptions/subscriptionExtraSessions.js \
            src/services/subscriptions/subscriptionPlanPurchase.js \
            src/services/subscriptions/subscriptionLifecycle.js
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No source changes needed."
          else
            git commit -m "Harden operational subscription services"
            git push origin HEAD:main
          fi
